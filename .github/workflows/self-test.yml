name: Self-test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run deterministic tests
        run: npm run check
      - name: Exercise the public action entrypoint
        uses: ./
        with:
          path: AGENTS.md
          fail_below: '45'
      - name: Exercise the published v1 tag
        if: github.event_name == 'workflow_dispatch'
        uses: sunxiayi/agents-md-starter-kit@v1
        with:
          path: AGENTS.md
          fail_below: '45'
